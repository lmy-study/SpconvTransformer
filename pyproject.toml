[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
[project]
name = "spconvtransformer"
version = "0.1.0"
description = "Dual sparse convolution and voxel Transformer backbone"
requires-python = ">=3.9"
dependencies = ["torch>=1.13", "numpy<2"]
[tool.setuptools.packages.find]
include = ["spconvtransformer*"]
